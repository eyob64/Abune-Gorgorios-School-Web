<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Abune Gorgorios School</title>
    <meta name="description" content="Official website and Android mobile app for Abune Gorgorios School - Shaping Minds, Building Futures. Features comprehensive student, faculty, and event management." />
    <meta property="og:title" content="Abune Gorgorios School" />
    <meta property="og:description" content="Official website and Android mobile app for Abune Gorgorios School - Shaping Minds, Building Futures. Features comprehensive student, faculty, and event management." />
    
    <!-- Android & PWA Meta Tags -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AG School" />
    
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <script>
      // Gracefully ignore WebSocket connection errors from dev HMR in sandboxed iframe environments
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('ws:'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-amber-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
